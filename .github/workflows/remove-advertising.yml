name: Remove advertising blocks

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove gg-cta blocks from Markdown files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          
          pattern = re.compile(
              r'<!-- gg-cta:(?:top|bottom):start -->.*?<!-- gg-cta:(?:top|bottom):end -->\s*',
              re.DOTALL,
          )
          for path in Path('.').rglob('*.md'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              cleaned = pattern.sub('', text)
              if cleaned != text:
                  path.write_text(cleaned, encoding='utf-8')
          PY
      - name: Commit cleaned files
        shell: bash
        run: |
          rm -f .github/workflows/remove-advertising.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Remove advertising blocks from Markdown files'
          git push
